<body class="login-main"><div id="loader"><canvas id="earth" aria-label="Rotating Earth"></canvas><p>Entering Another World</p><div class="bar"><i></i></div></div><div class="galaxy"></div><div class="grain"></div><header><div class="wrap nav"><a class="logo" href="index.html"><img src="/assets/brand/logo-full.svg" alt="Another World"></a><nav class="links"><a href="index.html#services">Research</a><a href="index.html#mission">Mission</a><a href="index.html#contact">Contact</a><a class="btn ghost active" href="login.html">Login</a></nav></div></header>
<main class="login-page"><div class="gcard">
 <div class="mark"><img src="/assets/brand/logo-emblem.svg" alt="Another World"></div>
 <h1>Welcome back</h1><p class="sub">Sign in to continue your journey through the universe</p>
 <form id="login" novalidate>
  <div class="f" style="--i:0"><input name="email" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address"></div>
  <div class="f" style="--i:1"><input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="eye" id="eye" type="button">Show</button></div>
  <div class="opts f" style="--i:2"><label><input type="checkbox" checked style="width:auto;margin-right:6px">Remember me</label><a href="#">Forgot password?</a></div>
  <div class="f" style="--i:3"><button class="btn" type="submit">Sign In <span class="arr">&rarr;</span></button></div>
  <div class="or f" style="--i:4">or</div>
  <div class="f" style="--i:5"><button class="btn ghost" type="button">Continue with Google</button></div>
  <div class="msg" id="msg" role="status"></div>
 </form>
 <p class="sub" style="margin:18px 0 0">New here? <a href="#" style="color:var(--brand-blue)">Create an account</a></p>
